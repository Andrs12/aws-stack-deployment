all:
  vars:
    ansible_user: ec2-user
    ansible_ssh_private_key_file: ~/.ssh/devops-stack-key
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

  children:
    bastion:
      hosts:
        bastion:
          ansible_host: 34.249.11.218

    app_servers:
      hosts:
        app-1:
          ansible_host: 10.0.10.182
          ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -q -i ~/.ssh/devops-stack-key ec2-user@34.249.11.218" -o StrictHostKeyChecking=no'
          
        app-2:
          ansible_host: 10.0.11.121
          ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -q -i ~/.ssh/devops-stack-key ec2-user@34.249.11.218" -o StrictHostKeyChecking=no'