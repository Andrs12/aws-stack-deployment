all:
  vars:
    ansible_user: ec2-user
    ansible_ssh_private_key_file: ~/.ssh/devops-stack-key
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

  children:
    bastion:
      hosts:
        bastion:
          ansible_host: 54.216.239.8

    app_servers:
      hosts:
        app-1:
          ansible_host: 10.0.10.181
          ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -q -i ~/.ssh/devops-stack-key ec2-user@54.216.239.8" -o StrictHostKeyChecking=no'
          
        app-2:
          ansible_host: 10.0.11.18
          ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -q -i ~/.ssh/devops-stack-key ec2-user@54.216.239.8" -o StrictHostKeyChecking=no'