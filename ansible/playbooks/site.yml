---
- name: Configure all servers
  hosts: all
  become: yes
  roles:
    - common

- name: Configure application servers
  hosts: role_webserver
  become: yes
  roles:
    - docker
    - nodejs
    - nginx

- name: Deploy backend and frontend
  hosts: role_webserver
  become: yes
  tasks:
    - import_playbook: ../playbooks/deploy-backend.yml
    - import_playbook: ../playbooks/deploy-frontend.yml