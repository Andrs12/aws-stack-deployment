---
- name: Deploy Frontend Portfolio
  hosts: app_servers
  become: yes
  vars:
    app_dir: /opt/app
  
  tasks:
    - name: Create frontend directory
      file:
        path: "{{ app_dir }}/frontend"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Copy index.html to servers
      copy:
        src: ../files/index.html
        dest: "{{ app_dir }}/frontend/index.html"
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: Update backend server.js to serve frontend
      copy:
        dest: "{{ app_dir }}/backend/server.js"
        owner: ec2-user
        group: ec2-user
        content: |
          const express = require('express');
          const cors = require('cors');
          const path = require('path');
          const os = require('os');
          
          const app = express();
          app.use(cors());
          app.use(express.json());
          
          // Serve static frontend files
          app.use(express.static('/frontend'));
          
          // API endpoints
          app.get('/health', (req, res) => {
            res.json({
              status: 'healthy',
              server: os.hostname(),
              timestamp: new Date().toISOString()
            });
          });
          
          app.get('/api/info', (req, res) => {
            res.json({
              app: 'DevOps Stack API',
              version: '1.0.0',
              server: os.hostname(),
              node: process.version,
              uptime: Math.floor(process.uptime())
            });
          });
          
          // Fallback to index.html for SPA routing
          app.use(express.static('/frontend'));
          
          app.listen(3000, () => console.log('✅ Backend + Frontend ready on port 3000'));

    - name: Update docker-compose.yml with frontend volume
      copy:
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ec2-user
        group: ec2-user
        content: |
          version: '3.8'
          services:
            backend:
              build: ./backend
              ports:
                - "80:3000"
              volumes:
                - ./frontend:/frontend:ro
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
                interval: 10s
                timeout: 5s
                retries: 3
                start_period: 10s

    - name: Rebuild and restart containers
      shell: docker compose up -d --build --force-recreate
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for service ready
      wait_for:
        port: 80
        delay: 10
        timeout: 60

    - name: Test frontend endpoint
      uri:
        url: http://localhost/
        return_content: yes
        status_code: 200
      register: frontend_check

    - name: Test API endpoint
      uri:
        url: http://localhost/api/info
        return_content: yes
        status_code: 200
      register: api_check

    - name: Display deployment status
      debug:
        msg: 
          - "✅ Frontend deployed successfully"
          - "✅ Backend API responding: {{ api_check.json.app }}"
          - "✅ Server: {{ api_check.json.server }}"