stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  APP_VERSION: ${CI_COMMIT_SHORT_SHA}

# Build Docker image
build:backend:
  stage: build
  tags:
    - aws
  script:
    - echo "🔨 Building backend version ${APP_VERSION}"
    - cd /opt/app
    - docker-compose build  # Sin --no-cache para v1
    - docker tag app-backend:latest app-backend:${APP_VERSION} || true
    - echo "✅ Build completed"
  only:
    - main

# Test application health
test:health:
  stage: test
  tags:
    - aws
  script:
    - echo "🧪 Testing application health..."
    - |
      for i in {1..5}; do
        if curl -f http://localhost/health; then
          echo "✅ Health check passed"
          exit 0
        fi
        echo "Retry $i/5..."
        sleep 5
      done
      echo "❌ Health check failed"
      exit 1
  only:
    - main

# Deploy to production (manual approval required)
deploy:production:
  stage: deploy
  tags:
    - aws
    - deploy
  script:
    - echo "🚀 Deploying version ${APP_VERSION} to production..."
    - cd /opt/app
    
    # Recreate containers with new build
    - docker-compose up -d --build --force-recreate
    
    - echo "⏳ Waiting for services to be healthy..."
    - sleep 15
    
    # Verify deployment
    - |
      for i in {1..10}; do
        if curl -f http://localhost/health; then
          echo "✅ Deployment verified"
          exit 0
        fi
        echo "Waiting for service... $i/10"
        sleep 5
      done
      echo "⚠️ Service not responding, check logs"
      docker-compose logs --tail 20
      exit 1
    
    - echo "🎉 Production deployment successful!"
  
  environment:
    name: production
  
  only:
    - main
  
  when: manual  # Requiere aprobación manual

# Show pipeline info
pipeline:info:
  stage: .pre
  tags:
    - aws
  script:
    - echo "📦 Pipeline triggered"
    - echo "👤 User ${GITLAB_USER_LOGIN}"
    - echo "📝 Commit ${CI_COMMIT_SHORT_SHA}"
    - echo "🌿 Branch ${CI_COMMIT_REF_NAME}"
    - echo "🐳 Docker version:"
    - docker --version
    - docker-compose --version || docker compose version
  only:
    - main